<svg width="700" height="200" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <style>
      .label { font-family: 'Fira Code', 'Courier New', monospace; font-size: 15px; fill: #E5E7EB; }
      .sub   { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #9CA3AF; }
      .track { fill: #1F2937; }
    </style>
  </defs>

  <rect width="700" height="200" fill="transparent"/>

  <!-- Frontend -->
  <text x="10" y="28" class="label">Frontend</text>
  <rect x="150" y="14" width="500" height="16" rx="8" class="track"/>
  <rect x="150" y="14" height="16" rx="8" width="0" fill="url(#barGradient)">
    <animate attributeName="width" from="0" to="454" dur="1.6s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
  <text x="10" y="46" class="sub">JavaScript · React · CSS</text>

  <!-- Backend -->
  <text x="10" y="78" class="label">Backend</text>
  <rect x="150" y="64" width="500" height="16" rx="8" class="track"/>
  <rect x="150" y="64" height="16" rx="8" width="0" fill="url(#barGradient)">
    <animate attributeName="width" from="0" to="341" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
  <text x="10" y="96" class="sub">Node.js · Express</text>

  <!-- Databases -->
  <text x="10" y="128" class="label">Databases</text>
  <rect x="150" y="114" width="500" height="16" rx="8" class="track"/>
  <rect x="150" y="114" height="16" rx="8" width="0" fill="url(#barGradient)">
    <animate attributeName="width" from="0" to="318" dur="1.6s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
  <text x="10" y="146" class="sub">MongoDB · MySQL</text>

  <!-- Tools -->
  <text x="10" y="178" class="label">Tools</text>
  <rect x="150" y="164" width="500" height="16" rx="8" class="track"/>
  <rect x="150" y="164" height="16" rx="8" width="0" fill="url(#barGradient)">
    <animate attributeName="width" from="0" to="386" dur="1.6s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
  <text x="10" y="196" class="sub">Git · GitHub · VS Code</text>
</svg>
